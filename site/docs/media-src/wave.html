<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wave</title>
<style>
  html, body { margin: 0; height: 100%; background: #ffffff; font-family: -apple-system, system-ui, "Segoe UI", sans-serif; color: #1d1d1f; }
  body { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 28px; }
  svg { width: 92%; height: 70%; }
  label { font-size: 32px; display: flex; gap: 24px; align-items: center; }
  input { width: 520px; accent-color: #0588ff; }
</style>
</head>
<body>
<svg viewBox="0 0 1000 400" aria-label="A sine wave">
  <line x1="0" y1="200" x2="1000" y2="200" stroke="#e8e8ed" stroke-width="2"/>
  <path id="wave" fill="none" stroke="#0588ff" stroke-width="8" stroke-linecap="round"/>
</svg>
<label>Frequency <input id="f" type="range" min="1" max="8" step="0.1" value="3"></label>
<script>
  const wave = document.getElementById('wave');
  const f = document.getElementById('f');
  const draw = () => {
    let d = '';
    for (let x = 0; x <= 1000; x += 5) {
      const y = 200 - 150 * Math.sin((x / 1000) * Number(f.value) * 2 * Math.PI);
      d += `${x === 0 ? 'M' : 'L'} ${x} ${y.toFixed(1)} `;
    }
    wave.setAttribute('d', d);
  };
  f.addEventListener('input', draw);
  draw();
</script>
</body>
</html>
