<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#16161e" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#eceef2" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="referrer" content="no-referrer" />
    <title>Remote</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  </head>
  <body>
    <main id="remote" class="remote" data-connection="connecting">
      <header class="remote-bar">
        <span class="remote-status" role="status"><i aria-hidden="true"></i><span id="status-text">Connecting…</span></span>
        <span class="remote-wall" id="wall-clock" aria-label="Local time">--:--</span>
      </header>

      <section class="remote-stage" id="stage-area" aria-label="Slides">
        <div class="remote-current">
          <div class="remote-preview" id="current-preview"></div>
          <span class="remote-blank-badge" id="blank-badge" hidden>Audience screen is blank</span>
        </div>
        <div class="remote-info">
          <div class="remote-position">
            <strong id="slide-label">–</strong>
            <span id="build-label"></span>
          </div>
          <div class="remote-timers">
            <strong id="elapsed" class="remote-elapsed">00:00</strong>
            <span>on slide <span id="slide-elapsed">00:00</span></span>
          </div>
        </div>
        <div class="remote-upnext">
          <span class="remote-label" id="next-label">Next</span>
          <div class="remote-preview remote-preview-next" id="next-preview"></div>
        </div>
      </section>

      <section class="remote-notes" aria-label="Speaker notes">
        <div class="remote-notes-head">
          <span class="remote-label">Notes</span>
          <span class="remote-size">
            <button type="button" id="notes-smaller" aria-label="Smaller notes text">A−</button>
            <button type="button" id="notes-larger" aria-label="Larger notes text">A+</button>
          </span>
        </div>
        <div class="remote-notes-text" id="notes" tabindex="0"></div>
      </section>

      <footer class="remote-controls">
        <button type="button" id="prev" class="remote-prev" aria-label="Previous">‹ Prev</button>
        <button type="button" id="blank" class="remote-blank" aria-pressed="false">Blank</button>
        <button type="button" id="next" class="remote-next primary" aria-label="Next">Next ›</button>
      </footer>

      <div class="remote-overlay" id="overlay" hidden>
        <div class="remote-overlay-card">
          <h1 id="overlay-title"></h1>
          <p id="overlay-text"></p>
        </div>
      </div>
    </main>
    <script type="module" src="./remote.ts"></script>
  </body>
</html>
